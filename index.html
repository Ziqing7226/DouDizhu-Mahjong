<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <!--
    斗地主 —— 纯前端单机斗地主游戏

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>斗地主 · 麻将</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="app">

    <!-- ============ 顶栏 ============ -->
    <header class="topbar">
      <div class="brand">
        <button class="lobby-btn" id="btnGameMode" title="返回游戏大厅，切换游戏">🎮 游戏大厅</button>
        <span class="logo" id="logoText">斗地主</span>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnMusic" title="背景音乐开关">🎵</button>
        <input type="range" class="vol-slider" id="volMusic" min="0" max="100" value="40" title="音乐音量">
        <button class="icon-btn" id="btnVoice" title="语音播报开关">🗣</button>
        <button class="icon-btn" id="btnSound" title="音效开关">🔊</button>
        <button class="icon-btn" id="btnStats" title="战绩统计">📊</button>
        <button class="icon-btn" id="btnHelp" title="玩法规则">?</button>
      </div>
    </header>

    <div class="main">

      <!-- ============ 斗地主视图 ============ -->
      <div class="game-view" id="ddzView">

        <!-- ============ 牌桌 ============ -->
        <div class="play-area" id="playArea">

        <!-- ============ 选场大厅（覆盖牌桌） ============ -->
        <div class="lobby" id="lobby">
          <div class="lobby-card">
            <div class="lobby-title">选 择 场 次</div>
            <div class="lobby-sub">挑选你的对手，即刻开局</div>
            <div class="lobby-rooms">
              <button class="room-btn" data-d="easy">
                <span class="room-icon">🌱</span>
                <span class="room-name">新手场</span>
              </button>
              <button class="room-btn" data-d="hard">
                <span class="room-icon">⚔️</span>
                <span class="room-name">高手场</span>
              </button>
              <button class="room-btn" data-d="master">
                <span class="room-icon">👑</span>
                <span class="room-name">大师场</span>
              </button>
            </div>
            <div class="lobby-note">每局结束后可随时返回这里更换场次</div>
          </div>
        </div>

        <div class="top-row">
          <div class="player-box" id="box-2"></div>

          <div class="center-top">
            <div class="bottom-cards" id="bottomCards"></div>
            <div class="bottom-label">底 牌</div>
            <div class="mult-badge" id="multBadge">底分 100 · 倍数 ×1</div>
          </div>

          <div class="player-box" id="box-1"></div>
        </div>

        <div class="table-center" id="tableCenter">
          <div class="play-slot" data-seat="2">
            <div class="cards"></div>
          </div>
          <div class="play-slot" data-seat="1">
            <div class="cards"></div>
          </div>
          <div class="play-slot" data-seat="0">
            <div class="cards"></div>
          </div>
        </div>

        <div class="my-row">
          <div class="player-box" id="box-0"></div>
          <div class="hand-wrap">
            <div class="hand" id="myHand"></div>
          </div>
          <div class="action-bar">
            <button class="btn" id="btnPlay">出牌</button>
            <button class="btn ghost" id="btnPass">不要</button>
            <button class="btn ghost" id="btnHint">提示</button>
            <button class="btn ghost" id="btnClear">重选</button>
          </div>
        </div>

      </div>

      <!-- ============ 侧栏 ============ -->
      <aside class="sidebar">
        <div class="panel">
          <h3>记 牌 器 <span class="sub">未出现的牌</span></h3>
          <div class="counter-grid" id="counterGrid"></div>
        </div>

        <div class="panel">
          <h3>对 局 信 息</h3>
          <div class="info-list" id="infoList"></div>
        </div>

        <div class="panel">
          <h3>出 牌 记 录</h3>
          <div class="log-list" id="logList"></div>
        </div>
      </aside>

      </div>

      <!-- ============ 麻将视图 ============ -->
      <div class="game-view" id="mjView" style="display:none">

        <!-- ============ 麻将牌桌 ============ -->
        <div class="mj-table" id="mjTable">

          <!-- 麻将选场大厅 -->
          <div class="lobby" id="mjLobby">
            <div class="lobby-card">
              <div class="lobby-title">选 择 场 次</div>
              <div class="lobby-sub">挑选你的牌友，即刻开局</div>
              <div class="lobby-rooms">
                <button class="room-btn" data-d="easy">
                  <span class="room-icon">🌱</span>
                  <span class="room-name">新手场</span>
                </button>
                <button class="room-btn" data-d="hard">
                  <span class="room-icon">⚔️</span>
                  <span class="room-name">高手场</span>
                </button>
                <button class="room-btn" data-d="master">
                  <span class="room-icon">👑</span>
                  <span class="room-name">大师场</span>
                </button>
              </div>
              <div class="lobby-note">每局结束后可随时返回这里更换场次</div>
            </div>
          </div>

          <!-- 对手座位：0 我 / 1 右 / 2 上 / 3 左 -->
          <div class="mj-seat mj-seat-2" id="mjBox-2"></div>
          <div class="mj-seat mj-seat-1" id="mjBox-1"></div>
          <div class="mj-seat mj-seat-3" id="mjBox-3"></div>

          <!-- 牌河 -->
          <div class="mj-river mj-river-2" id="mjRiver-2"></div>
          <div class="mj-river mj-river-1" id="mjRiver-1"></div>
          <div class="mj-river mj-river-3" id="mjRiver-3"></div>
          <div class="mj-river mj-river-0" id="mjRiver-0"></div>
          <div class="mj-wall-info" id="mjWallInfo">牌墙余 — 张</div>

          <!-- 我的手牌 + 操作 -->
          <div class="mj-actions">
            <button class="btn gold" id="mjBtnHu">胡</button>
            <button class="btn ghost" id="mjBtnGang">杠</button>
            <button class="btn" id="mjBtnDiscard">打出</button>
            <button class="btn ghost" id="mjBtnHint">提示</button>
          </div>
          <div class="mj-my-row">
            <div class="mj-seat mj-seat-0" id="mjBox-0"></div>
            <div class="mj-hand" id="mjHand"></div>
          </div>

        </div>

        <!-- ============ 麻将侧栏 ============ -->
        <aside class="sidebar">
          <div class="panel">
            <h3>余 牌 器 <span class="sub">未出现的牌</span></h3>
            <div class="counter-grid mj-counter" id="mjCounterGrid"></div>
          </div>
          <div class="panel">
            <h3>对 局 信 息</h3>
            <div class="info-list" id="mjInfoList"></div>
          </div>
          <div class="panel">
            <h3>各 家 积 分</h3>
            <div class="info-list" id="mjScoreList"></div>
          </div>
          <div class="panel">
            <h3>牌 谱</h3>
            <div class="log-list" id="mjLogList"></div>
          </div>
        </aside>

      </div>

    </div>
  </div>

  <!-- ============ 游戏模式大厅 ============ -->
  <div class="mode-lobby" id="gameLobby">
    <div class="lobby-card">
      <div class="lobby-title">选 择 游 戏</div>
      <div class="lobby-sub">先挑一款，再去挑对手</div>
      <div class="lobby-rooms">
        <button class="room-btn" data-game="ddz">
          <span class="room-icon">🃏</span>
          <span class="room-name">斗地主</span>
          <span class="room-desc">经典三人牌局：叫分抢地主，农民联手对抗地主</span>
        </button>
        <button class="room-btn" data-game="mj">
          <span class="room-icon">🀄</span>
          <span class="room-name">麻 将</span>
          <span class="room-desc">标准四人麻将：吃碰杠胡，番种计分，火药味十足</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ 浮层 ============ -->
  <div id="floatLayer"></div>
  <div class="overlay" id="overlay">
    <div class="dialog" id="dialog"></div>
  </div>
  <div class="toast" id="toast"></div>

  <!-- ============ 移动端竖屏提示 ============ -->
  <div class="rotate-hint" id="rotateHint">
    <div class="rh-icon">📱</div>
    <div class="rh-text">请横屏游玩</div>
    <div class="rh-sub">转动手机，获得完整的牌桌视野</div>
  </div>

  <script src="js/cards.js"></script>
  <script src="js/decompose.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/music.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/mj/tiles.js"></script>
  <script src="js/mj/rules.js"></script>
  <script src="js/mj/ai.js"></script>
  <script src="js/mj/ui.js"></script>
  <script src="js/mj/game.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
